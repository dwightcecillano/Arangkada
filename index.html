<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arangkada: a working demo of a multi-branch motorcycle dealer console with offline-first sync, financing and LTO tracking.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<title>Arangkada – Dealer network console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <button class="logo" data-act="go" data-v="home">ARANGKADA</button>
    <nav class="links" aria-label="Main" id="links"></nav>
    <div class="tools">
      <button class="icon-btn" data-act="pal" aria-label="Open quick commands">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="kbd">Ctrl K</span></button>
      <select id="as" class="branch-sel" aria-label="Working as branch"></select>
      <button id="conn" class="conn" data-act="toggle-cur"></button>
      <button id="outbox" class="outbox" data-act="go" data-v="network"><span class="hide-sm">Outbox</span><b id="ob-n">0</b></button>
    </div>
  </div>
  <div class="pulse"><div class="wrap" id="pulse"></div></div>
</header>
<main id="main"></main>
<footer class="foot" id="foot"></footer>
<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="New sale" aria-hidden="true"></aside>
<div class="pal" id="pal" data-act="pal-bg">
  <div class="pal-box" role="dialog" aria-label="Quick commands">
    <input id="pal-q" type="search" placeholder="Type a command, branch or model" role="combobox" aria-controls="pal-list" aria-expanded="true" autocomplete="off">
    <ul class="pal-list" id="pal-list" role="listbox"></ul>
    <div class="pal-foot"><span>↑ ↓ to move</span><span>Enter to run</span><span>Esc to close</span></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/app.js"></script>
</body></html>
